name: ssh-filtering

topology:
  nodes:
    client:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.30.1.2/24 dev eth1
        - ip route add 10.30.2.0/24 via 10.30.1.1

    fw:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.30.1.1/24 dev eth1
        - ip addr add 10.30.2.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - nft add table inet filter
        - "nft add chain inet filter forward '{ type filter hook forward priority 0; policy drop; }'"
        - nft add rule inet filter forward iifname "eth1" oifname "eth2" tcp dport 2222 ct state new,established accept
        - nft add rule inet filter forward iifname "eth2" oifname "eth1" tcp sport 2222 ct state established accept

    server:
      kind: linux
      image: python:3.12-alpine
      exec:
        - ip addr add 10.30.2.2/24 dev eth1
        - ip route add 10.30.1.0/24 via 10.30.2.1
        - sh -c "mkdir -p /srv/ssh22 /srv/alt2222 && printf 'ssh22\n' >/srv/ssh22/index.html && printf 'alt2222\n' >/srv/alt2222/index.html && nohup python3 -m http.server 22 --bind 10.30.2.2 --directory /srv/ssh22 >/tmp/ssh22.log 2>&1 & nohup python3 -m http.server 2222 --bind 10.30.2.2 --directory /srv/alt2222 >/tmp/alt2222.log 2>&1 &"

  links:
    - endpoints: ["client:eth1", "fw:eth1"]
    - endpoints: ["fw:eth2", "server:eth1"]
