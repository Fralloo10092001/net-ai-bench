name: fw-isav

topology:
  nodes:
    wan:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 198.51.100.2/24 dev eth1
        - ip route add 10.10.20.0/24 via 198.51.100.1

    fw:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 198.51.100.1/24 dev eth1
        - ip addr add 10.10.20.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1

    lan:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.20.2/24 dev eth1
        - ip route add 198.51.100.0/24 via 10.10.20.1

  links:
    - endpoints: ["wan:eth1", "fw:eth1"]
    - endpoints: ["fw:eth2", "lan:eth1"]
