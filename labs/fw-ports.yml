name: fw-ports

topology:
  nodes:
    wan:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.40.1.2/24 dev eth1
        - ip route add 10.40.2.0/24 via 10.40.1.1

    fw:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 10.40.1.1/24 dev eth1
        - ip addr add 10.40.2.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1

    lan:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.40.2.2/24 dev eth1
        - ip route add 10.40.1.0/24 via 10.40.2.1

  links:
    - endpoints: ["wan:eth1", "fw:eth1"]
    - endpoints: ["fw:eth2", "lan:eth1"]
