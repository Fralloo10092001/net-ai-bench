global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 1s
  timeout client 5s
  timeout server 5s

frontend vip_http
  bind *:8080
  default_backend app_pool

backend app_pool
  balance roundrobin
  option httpchk GET /
  server backend-a 10.2.21.101:8080 check
  server backend-b 10.2.22.102:8080 check
